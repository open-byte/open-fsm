[project]
name = "open-fsm"
version = "1.0.1"
description = "A generic, ORM-agnostic finite state machine for Python with zero dependencies: the declarative django-fsm API as a standalone core for flows and models. Works with Django, SQLAlchemy, Tortoise or plain objects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Izcar J. Munoz Torrez", email = "izcarmt95@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["fsm", "finite-state-machine", "state-machine", "workflow", "transitions", "django-fsm"]
dependencies = [
    "typing-extensions>=4.16.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://open-byte.github.io/open-fsm/"
Documentation = "https://open-byte.github.io/open-fsm/"
Repository = "https://github.com/open-byte/open-fsm"
Issues = "https://github.com/open-byte/open-fsm/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-cov>=6.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mkdocs-material[imaging]>=9.7.0",
]

[tool.pytest.ini_options]
addopts = "--doctest-glob=*.md --doctest-continue-on-failure"
testpaths = ["tests", "docs"]
pythonpath = ["."]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "IGNORE_EXCEPTION_DETAIL"]

[tool.ruff]
src=["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade\
    "ANN"
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "ANN401",  # dynamic typing Any
    "UP045",  # Optional[Type] is not a valid type hint, use Type | None instead
]
fixable = ["F401", "ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
